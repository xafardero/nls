name: Bug report
description: Report behavior that differs from what you expected.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug. Remove sensitive network details before submitting.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the actual behavior and the behavior you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `...`
        2. Press `...`
        3. Observe `...`
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include nls version, OS, terminal, Go version (if built from source), and nmap version.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste relevant output. Redact IP addresses, MAC addresses, hostnames, and other private network details.
    validations:
      required: false
